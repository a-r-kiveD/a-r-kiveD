<svg xmlns="http://www.w3.org/2000/svg" width="620" height="270" viewBox="0 0 620 270" role="img" aria-labelledby="title desc">
  <title id="title">Binary Octocat says hi</title>
  <desc id="desc">An Octocat drawn from binary digits, waving and saying hi.</desc>
  <defs>
    <linearGradient id="binaryGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#72e6ff"/>
      <stop offset="55%" stop-color="#a7b4ff"/>
      <stop offset="100%" stop-color="#f5a7ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="octocatShape">
      <path d="M238 78 L246 35 L285 56 Q315 44 346 56 L389 34 L396 79 Q419 99 416 128 Q414 157 391 174 Q378 183 365 185 C364 201 376 211 394 218 C414 226 408 242 392 240 C376 238 368 225 357 215 C365 233 355 249 341 249 C325 249 317 233 319 216 C311 232 297 243 282 240 C265 236 271 220 285 209 Q296 199 292 185 Q263 179 244 158 Q225 136 228 111 Q230 92 238 78 Z"/>
    </clipPath>
    <style>
      .binary { font-family: Consolas, Monaco, 'Courier New', monospace; font-weight: 700; fill: url(#binaryGlow); }
      .matrix { font-size: 13px; letter-spacing: 1.2px; }
      .wave-arm { transform-box: fill-box; transform-origin: 0% 100%; animation: wave 1.05s ease-in-out infinite; }
      .hello { transform-box: fill-box; transform-origin: center; animation: hello 3.4s ease-in-out infinite; }
      .eyes { animation: blink 3.4s linear infinite; }
      @keyframes wave { 0%,100% { transform: rotate(0deg); } 30% { transform: rotate(-22deg); } 62% { transform: rotate(8deg); } }
      @keyframes hello { 0%,10% { opacity: .25; transform: translateY(5px); } 22%,72% { opacity: 1; transform: translateY(0); } 84%,100% { opacity: .45; transform: translateY(-2px); } }
      @keyframes blink { 0%,45%,49%,100% { opacity: 1; } 47% { opacity: .12; } }
      @media (prefers-reduced-motion: reduce) { .wave-arm, .hello, .eyes { animation: none; } }
    </style>
  </defs>

  <!-- Hello bubble -->
  <g class="hello" filter="url(#glow)">
    <path d="M37 58 Q37 44 51 44 H150 Q164 44 164 58 V101 Q164 115 150 115 H111 L95 132 L96 115 H51 Q37 115 37 101 Z" fill="#08111c" fill-opacity=".7" stroke="#79dfff" stroke-width="1.7" stroke-dasharray="4 5"/>
    <text x="100" y="86" text-anchor="middle" fill="#e8fbff" font-family="Consolas, monospace" font-size="25" font-weight="700">Hi!</text>
  </g>

  <!-- The silhouette is filled only with binary digits -->
  <g clip-path="url(#octocatShape)" class="binary matrix" filter="url(#glow)">
    <text x="246" y="51">0101</text><text x="367" y="51">1010</text>
    <text x="215" y="65">01010101010101010101010101</text>
    <text x="208" y="80">10101010101010101010101010</text>
    <text x="201" y="95">01010101010101010101010101</text>
    <text x="197" y="110">10101010101010101010101010</text>
    <text x="194" y="125">01010101010101010101010101</text>
    <text x="194" y="140">10101010101010101010101010</text>
    <text x="197" y="155">01010101010101010101010101</text>
    <text x="201" y="170">10101010101010101010101010</text>
    <text x="207" y="185">01010101010101010101010101</text>
    <text x="216" y="200">10101010101010101010101010</text>
    <text x="230" y="215">01010101010101010101010101</text>
    <text x="249" y="230">10101010101010101010101010</text>
  </g>
  <path d="M238 78 L246 35 L285 56 Q315 44 346 56 L389 34 L396 79 Q419 99 416 128 Q414 157 391 174 Q378 183 365 185 C364 201 376 211 394 218 C414 226 408 242 392 240 C376 238 368 225 357 215 C365 233 355 249 341 249 C325 249 317 233 319 216 C311 232 297 243 282 240 C265 236 271 220 285 209 Q296 199 292 185 Q263 179 244 158 Q225 136 228 111 Q230 92 238 78 Z" fill="none" stroke="#b1dcff" stroke-opacity=".6" stroke-width="1.1"/>

  <!-- Dark face window makes the binary eyes readable -->
  <ellipse cx="317" cy="143" rx="53" ry="25" fill="#07111c" fill-opacity=".88"/>

  <!-- Face details: binary zeros for eyes, binary smile -->
  <g class="binary eyes" filter="url(#glow)" font-size="19" font-weight="700">
    <text x="276" y="143" fill="#ffd7ff">0</text>
    <text x="353" y="143" fill="#ffd7ff">0</text>
    <text x="308" y="163" font-size="14" fill="#87eaff">010</text>
  </g>

  <!-- A separate binary arm that waves -->
  <g class="wave-arm binary" filter="url(#glow)">
    <text x="409" y="145" font-size="13">01</text>
    <text x="421" y="129" font-size="13">1010</text>
    <text x="432" y="113" font-size="13">010101</text>
    <text x="446" y="97" font-size="13">101010</text>
    <text x="463" y="85" font-size="13">0101</text>
  </g>

  <!-- A tiny terminal-like signature -->
  <text x="34" y="224" fill="#9db8ff" font-family="Consolas, monospace" font-size="11" opacity=".82">01001000 01101001</text>
  <text x="34" y="241" fill="#9db8ff" font-family="Consolas, monospace" font-size="11" opacity=".55">&gt; hello_world()</text>
</svg>
